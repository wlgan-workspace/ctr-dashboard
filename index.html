<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>亲子频道 CTR 数据看板</title>
<style>
:root {
  --bg:#f7f6f3; --panel:#fff; --text:#37352f; --muted:#787774; --line:#e6e4df; --line2:#d8d6d1;
  --dark:#37352f; --soft:#f1f0ec; --soft2:#fbfaf8; --green:#2f7d46; --red:#b42318; --shadow:0 1px 2px rgba(15,15,15,.06),0 8px 24px rgba(15,15,15,.04); --radius:12px;
}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5;font-size:12px}
.header{padding:30px 28px 16px;border-bottom:1px solid var(--line);background:var(--bg)}
.header-inner{max-width:1320px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
h1{margin:0;font-size:30px;line-height:1.15;letter-spacing:-.03em;font-weight:760}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:5px 9px;border-radius:6px;background:#efeee9;border:1px solid #e4e2dc;font-size:12px;color:#5f5e59}
.container{max-width:1320px;margin:0 auto;padding:18px 24px 42px}
.grid{display:grid;gap:16px}
.filter-panel{position:sticky;top:0;z-index:30;background:rgba(247,246,243,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(15,15,15,.05);padding:14px 16px;margin-bottom:16px}
.filter-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:12px}
.filter-title{font-size:16px;font-weight:720}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{height:38px;border:1px solid #d6d4cf;border-radius:6px;padding:0 12px;cursor:pointer;font-weight:650;color:#fff;background:var(--dark);font-size:12px}
button:hover{background:#2f2e2a}
button.secondary{background:white;color:var(--text);box-shadow:none;border:1px solid var(--line)}
button.secondary:hover{background:var(--soft)}
.filters{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;align-items:end}
.field label{display:block;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:650}
.custom-select{position:relative}
.select-btn{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--text);padding:0 10px;text-align:left;font-weight:520;display:flex;align-items:center;justify-content:space-between;box-shadow:none;font-size:12px}
.select-btn:hover{background:white;color:var(--text);border-color:var(--line2)}
.select-btn:after{content:"⌄";color:var(--muted);font-size:12px}
.select-menu{display:none;position:absolute;left:0;right:0;top:42px;background:white;border:1px solid var(--line2);border-radius:8px;box-shadow:0 8px 24px rgba(15,15,15,.10);z-index:50;max-height:332px;overflow-y:auto;padding:4px}
.custom-select.open .select-menu{display:block}
.select-option{padding:8px 9px;border-radius:5px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.select-option:hover,.select-option.active{background:#f1f0ec}
.select-option input{accent-color:var(--dark);pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;min-width:0;overflow:hidden}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}
.section-title h2,.section-title h3{margin:0;font-size:18px;font-weight:740;letter-spacing:-.01em}
.section-title small{color:var(--muted);font-weight:500;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi-card{background:white;border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 1px 2px rgba(15,15,15,.04)}
.kpi-label{color:var(--muted);font-size:12px;font-weight:650;margin-bottom:8px}
.kpi-value{font-size:20px;font-weight:760;letter-spacing:-.02em;line-height:1.08;white-space:nowrap}
.kpi-sub{margin-top:8px;color:var(--muted);font-size:12px;line-height:1.5}
.delta{display:inline-flex;align-items:center;gap:4px;padding:2px 6px;border-radius:5px;font-size:12px;font-weight:800;margin-left:6px;background:#efeee9;color:#5f5e59}
.delta.up{color:var(--green);background:#eaf3ec;font-weight:900}
.delta.down{color:var(--red);background:#f7ebe9;font-weight:900}
.delta.flat{color:#5f5e59;background:#efeee9}
.chart{min-height:300px;width:100%;overflow-x:auto;overflow-y:hidden;background:#fbfaf8;border:1px solid #eeece7;border-radius:8px;padding:4px}
.chart svg{display:block;min-width:100%;height:300px}
.chart text{font-size:12px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.trend-table{max-height:430px;overflow-y:auto}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:780px;font-size:12px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:12px}
th{position:sticky;top:0;z-index:2;background:#f7f6f3;color:#5f5e59;font-weight:650;border-bottom:1px solid var(--line2);cursor:pointer}
tbody tr:hover{background:#fbfaf8}
tr:last-child td{border-bottom:0}
.num{text-align:left;font-variant-numeric:tabular-nums}
.rank{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;background:#efeee9;color:#5f5e59;font-weight:700}
.rank.top{background:#37352f;color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{background:#fff;color:#5f5e59;box-shadow:none;border:1px solid var(--line);height:34px;border-radius:6px}
.tab:hover{background:#f1f0ec;color:#5f5e59}
.tab.active{background:#37352f;color:#fff;border-color:#37352f}
.funnel{display:grid;gap:10px}
.funnel-row{display:grid;grid-template-columns:32px minmax(160px,1.2fr) minmax(220px,2fr) 92px 92px 82px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfaf8;font-size:12px}
.funnel-row.header{background:#f7f6f3;color:#5f5e59;font-weight:650;border-color:var(--line2)}
.funnel-index{color:var(--muted);font-size:12px;font-weight:650;text-align:center}
.funnel-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.funnel-track{height:24px;background:#efeee9;border-radius:6px;overflow:hidden;position:relative}
.funnel-fill{height:100%;background:#37352f;border-radius:6px;min-width:2px}
.funnel-track span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:#fff;font-weight:650;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.funnel-num,.funnel-ctr{text-align:left;font-variant-numeric:tabular-nums}
.funnel-ctr{font-weight:750;color:var(--text)}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick-card{border:1px solid var(--line);border-radius:10px;background:white;padding:12px;min-width:0}
.quick-title{font-size:12px;font-weight:740;margin-bottom:10px}
.quick-list{display:grid;gap:8px}
.quick-row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px}
.quick-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#5f5e59}
.quick-val{font-variant-numeric:tabular-nums;font-weight:720}
.notice{background:#fbfaf8;border:1px solid var(--line);color:#5f5e59;border-radius:10px;padding:12px 14px;font-size:12px;line-height:1.65}
.notice b{color:var(--text)}
.empty{color:var(--muted);padding:28px;text-align:center;font-size:12px}
.footer{color:var(--muted);font-size:12px;line-height:1.7;padding:2px 4px 0}
@media(max-width:1180px){.filters{grid-template-columns:1fr 1fr}.kpis,.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.header-inner{flex-direction:column;align-items:flex-start}.container{padding:14px}.filters,.kpis,.quick-grid{grid-template-columns:1fr}.filter-panel{position:relative}.funnel-row{grid-template-columns:28px minmax(140px,1fr) 1fr 72px}.funnel-row.header div:nth-last-child(-n+2),.funnel-row:not(.header) div:nth-last-child(-n+2){display:none}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div><h1>亲子频道 CTR 数据看板</h1></div>
    <div class="badges">
      <span class="badge" id="dateBadge">数据日期范围</span>
      <span class="badge">数据更新时间：2026-05-22 11:42:26</span>
      <span class="badge" id="regionBadge">Region</span>
      <span class="badge">组件：12 个</span>
    </div>
  </div>
</header>

<div class="container">
  <section class="filter-panel">
    <div class="filter-head">
      <div><div class="filter-title">筛选模块</div></div>
      <div class="actions">
        <button class="secondary" id="resetBtn">重置 All</button>
        <button id="exportBtn">导出Excel表</button>
      </div>
    </div>
    <div class="filters">
      <div class="field"><label>日期</label><div id="dateSelect" class="custom-select"></div></div>
      <div class="field"><label>Region</label><div id="regionSelect" class="custom-select"></div></div>
      <div class="field"><label>Locale</label><div id="localeSelect" class="custom-select"></div></div>
    </div>
  </section>

  <main class="grid">
    <section class="kpis" id="kpiBox"></section>

    <section class="card">
      <div class="section-title"><h2>Top / Bottom 快速视图</h2></div>
      <div class="quick-grid" id="quickBox"></div>
    </section>

    <section class="card">
      <div class="section-title"><h2>页面 CTR 每天趋势</h2><small id="pageTrendHint"></small></div>
      <div id="pageTrendChart" class="chart"></div>
      <div id="pageTrendTable"></div>
    </section>

    <section class="card">
      <div class="section-title"><h2>组件 CTR 漏斗</h2><small>按曝光 UV 从高到低排序，近似页面从上到下顺序</small></div>
      <div id="componentFunnel" class="funnel"></div>
    </section>

    <section class="card">
      <div class="section-title"><h2>明细数据</h2><small>默认按 CTR 从高到低排序</small></div>
      <div class="tabs">
        <button class="tab active" data-tab="page">页面 CTR 明细</button>
        <button class="tab" data-tab="component">组件 CTR 明细</button>
      </div>
      <div id="detailTable"></div>
    </section>

    <section class="notice"><b>口径说明：</b>页面 CTR = Σ导流页面 UV / Σ页面 UV；组件 CTR = Σ点击 UV / Σ曝光 UV。用户反馈、回到顶部无曝光埋点，曝光 UV 使用页面 UV。</section>
    <div class="footer">数据来源：亲子频道数据(2).xlsx。</div>
  </main>
</div>

<script>
let DATA;
const $ = id => document.getElementById(id);
let dates, regions, locales, state;

function fmtInt(v){ return (v||0).toLocaleString('en-US'); }
function fmtPct(v,d=2){ return v===null||v===undefined||Number.isNaN(v)?'N/A':(v*100).toFixed(d)+'%'; }
function fmtPp(v,d=2){ return v===null||v===undefined||Number.isNaN(v)?'N/A':(v*100).toFixed(d)+'pp'; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ratio(num,den){ return den>0 ? num/den : null; }
function deltaClass(v){ if(v==null||Math.abs(v)<0.0001) return 'flat'; return v>0?'up':'down'; }
function deltaText(v){ if(v==null) return '无对比'; return (v>=0?'+':'') + fmtPp(v); }
function deltaBadge(v){ return `<span class="delta ${deltaClass(v)}">${deltaText(v)}</span>`; }

function allSelected(set, options){ return options.length>0 && options.every(x=>set.has(x)); }
function labelFor(set, options, allLabel){
  if(allSelected(set, options)) return allLabel;
  if(set.size===0) return '未选择';
  if(set.size===1) return [...set][0];
  return `已选 ${set.size} 项`;
}
function normalizeSet(set, options){
  const next = new Set([...set].filter(x=>options.includes(x)));
  if(next.size===0) options.forEach(x=>next.add(x));
  return next;
}
function createMultiSelect(id, options, selectedSet, allLabel, onChange){
  const el=$(id);
  const isAll = allSelected(selectedSet, options);
  const rows = [
    `<div class="select-option ${isAll?'active':''}" data-value="__ALL__"><input type="checkbox" ${isAll?'checked':''}/> ${esc(allLabel)}</div>`,
    ...options.map(o=>`<div class="select-option ${selectedSet.has(o)?'active':''}" data-value="${esc(o)}"><input type="checkbox" ${selectedSet.has(o)?'checked':''}/> ${esc(o)}</div>`)
  ].join('');
  el.innerHTML = `<button type="button" class="select-btn">${esc(labelFor(selectedSet, options, allLabel))}</button><div class="select-menu">${rows}</div>`;
  const btn=el.querySelector('.select-btn');
  btn.onclick=(e)=>{ e.stopPropagation(); document.querySelectorAll('.custom-select').forEach(x=>x!==el&&x.classList.remove('open')); el.classList.toggle('open'); };
  el.querySelectorAll('.select-option').forEach(opt=>opt.onclick=(e)=>{
    e.stopPropagation();
    const val=opt.dataset.value;
    const next=new Set(selectedSet);
    if(val==='__ALL__'){
      if(allSelected(next, options)) next.clear(); else options.forEach(x=>next.add(x));
    } else {
      if(next.has(val)) next.delete(val); else next.add(val);
    }
    if(next.size===0) options.forEach(x=>next.add(x));
    onChange(next);
  });
}
document.addEventListener('click',()=>document.querySelectorAll('.custom-select').forEach(x=>x.classList.remove('open')));

function localeOptions(){ 
  if(allSelected(state.regions, regions)) return locales;
  return locales.filter(l=>DATA.pageRows.some(r=>state.regions.has(r.region) && r.locale===l));
}
function renderFilters(){
  const locOpts=localeOptions();
  state.locales = normalizeSet(state.locales, locOpts);
  createMultiSelect('dateSelect', dates, state.dates, 'All 日期', v=>{state.dates=v; renderAll();});
  createMultiSelect('regionSelect', regions, state.regions, 'All Region', v=>{state.regions=v; state.locales=new Set(localeOptions()); renderAll();});
  createMultiSelect('localeSelect', locOpts, state.locales, 'All Locale', v=>{state.locales=v; renderAll();});
}
function pass(r){ return state.dates.has(r.date) && state.regions.has(r.region) && state.locales.has(r.locale); }
function filteredPage(){ return DATA.pageRows.filter(r=>pass(r)); }
function filteredComp(){ return DATA.componentRows.filter(r=>pass(r)); }
function group(rows, keys, fields){
  const m = new Map();
  rows.forEach(r=>{
    const k = keys.map(x=>r[x]).join('||');
    if(!m.has(k)){ const o={}; keys.forEach(x=>o[x]=r[x]); fields.forEach(x=>o[x]=0); m.set(k,o); }
    const o=m.get(k); fields.forEach(x=>o[x]+=Number(r[x])||0);
  });
  return [...m.values()];
}
function pageAgg(rows, keys=[]){ return group(rows, keys, ['pageUV','flowUV']).map(r=>({...r, ctr: ratio(r.flowUV,r.pageUV)})); }
function compAgg(rows, keys=[]){ return group(rows, keys, ['exposureUV','clickUV']).map(r=>({...r, ctr: ratio(r.clickUV,r.exposureUV)})); }
function sorted(rows, key='ctr', dir=-1){
  return [...rows].sort((a,b)=>{ const va=a[key], vb=b[key]; if(va==null&&vb==null)return 0; if(va==null)return 1; if(vb==null)return -1; if(typeof va==='number'&&typeof vb==='number')return (va-vb)*dir; return String(va).localeCompare(String(vb),'zh-CN')*dir; });
}
function periodStats(rows, type){ return type==='page' ? (pageAgg(rows)[0] || {pageUV:0,flowUV:0,ctr:null}) : (compAgg(rows)[0] || {exposureUV:0,clickUV:0,ctr:null}); }
function dailyTrend(rows,type){ return sorted(type==='page'?pageAgg(rows,['date']):compAgg(rows,['date']),'date',1); }
function latestDelta(rows,type){ const t=dailyTrend(rows,type); if(t.length<2)return null; const a=t[t.length-1].ctr,b=t[t.length-2].ctr; return a!=null&&b!=null?a-b:null; }

function renderKPIs(){
  const pRows=filteredPage();
  const p=periodStats(pRows,'page'), pDelta=latestDelta(pRows,'page');
  const pageRegions=sorted(pageAgg(pRows,['region']),'ctr',-1).filter(r=>r.ctr!=null);
  const topRegion=pageRegions[0], bottomRegion=pageRegions[pageRegions.length-1];
  $('kpiBox').innerHTML = [
    kpiCard('页面 CTR', fmtPct(p.ctr)+deltaBadge(pDelta), `导流 UV ${fmtInt(p.flowUV)} / 页面 UV ${fmtInt(p.pageUV)}`),
    kpiCard('页面 UV', fmtInt(p.pageUV), `当前筛选范围页面访问 UV`),
    kpiCard('导流 UV', fmtInt(p.flowUV), `导流到下一级页面 UV`),
    kpiCard('最高 / 最低 Region', topRegion?`${esc(topRegion.region)} / ${esc(bottomRegion.region)}`:'N/A', topRegion?`最高 ${fmtPct(topRegion.ctr)}；最低 ${fmtPct(bottomRegion.ctr)}`:'当前筛选无数据')
  ].join('');
}
function kpiCard(label,value,sub){ return `<div class="kpi-card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-sub">${sub}</div></div>`; }

function lineChart(elId, rows, valueKey, labelKey){
  const el=$(elId);
  if(!rows.length){ el.innerHTML='<div class="empty">无数据</div>'; return; }
  const baseW=760, dayW=76;
  const w=Math.max(baseW, rows.length * dayW);
  const h=285,p={l:58,r:20,t:24,b:42};
  const vals=rows.map(r=>r[valueKey]).filter(v=>v!=null);
  if(!vals.length){ el.innerHTML='<div class="empty">无有效 CTR 数据</div>'; return; }
  const max=Math.max(...vals), min=Math.min(...vals);
  const yMax=max===min?max+0.01:max*1.12, yMin=Math.max(0, min*0.88);
  const x=i=>p.l+(w-p.l-p.r)*(rows.length===1?0.5:i/(rows.length-1));
  const y=v=>h-p.b-(h-p.t-p.b)*((v-yMin)/(yMax-yMin||1));
  const points=rows.map((r,i)=>`${x(i)},${y(r[valueKey]||0)}`).join(' ');
  const grid=[0,.25,.5,.75,1].map(t=>{ const yy=p.t+(h-p.t-p.b)*t; const val=yMax-(yMax-yMin)*t; return `<line x1="${p.l}" x2="${w-p.r}" y1="${yy}" y2="${yy}" stroke="#e6e4df"/><text x="8" y="${yy+4}" font-size="12" fill="#787774">${fmtPct(val,2)}</text>`; }).join('');
  const labels=rows.map((r,i)=>`<text x="${x(i)}" y="${h-16}" font-size="12" fill="#787774" text-anchor="middle">${String(r[labelKey]).slice(5)}</text>`).join('');
  const dots=rows.map((r,i)=>{ const prev=i>0?rows[i-1][valueKey]:null; const drop=prev!=null&&r[valueKey]!=null&&(r[valueKey]-prev)<-0.03; return `<g><circle cx="${x(i)}" cy="${y(r[valueKey]||0)}" r="${drop?5.8:4.6}" fill="${drop?'#b42318':'#fff'}" stroke="#37352f" stroke-width="2.4"><title>${r[labelKey]}：${fmtPct(r[valueKey],2)}${prev!=null?'，环比 '+deltaText(r[valueKey]-prev):''}</title></circle>${drop?`<text x="${x(i)}" y="${y(r[valueKey]||0)-10}" text-anchor="middle" font-size="12" fill="#b42318">↓</text>`:''}</g>`; }).join('');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="300" preserveAspectRatio="xMinYMin meet">${grid}<polyline points="${points}" fill="none" stroke="#37352f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}
function miniTable(elId, rows, cols, extraClass=''){
  if(!rows.length){ $(elId).innerHTML='<div class="empty">无数据</div>'; return; }
  $(elId).innerHTML = `<div class="table-wrap ${extraClass}"><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>`<td class="${c.num?'num':''}">${c.f?c.f(r[c.key],r,i):esc(r[c.key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function renderTrends(){
  const pTrend=dailyTrend(filteredPage(),'page');
  $('pageTrendHint').textContent = `${pTrend.length} 天；红点为环比下降超 3pp`;
  lineChart('pageTrendChart', pTrend, 'ctr', 'date');
  miniTable('pageTrendTable', pTrend, [
    {label:'日期',key:'date'},{label:'页面 CTR',key:'ctr',num:true,f:v=>fmtPct(v,2)},{label:'环比',key:'ctr',num:true,f:(v,r,i)=>i===0?'N/A':deltaBadge(v-pTrend[i-1].ctr)},{label:'页面 UV',key:'pageUV',num:true,f:fmtInt},{label:'导流 UV',key:'flowUV',num:true,f:fmtInt}
  ], 'trend-table');
}
function renderComponentFunnel(){
  const rows=sorted(compAgg(filteredComp(),['component']),'exposureUV',-1);
  const el=$('componentFunnel');
  if(!rows.length){ el.innerHTML='<div class="empty">当前筛选无组件数据</div>'; return; }
  const maxExposure=Math.max(...rows.map(r=>r.exposureUV||0),1);
  const header=`<div class="funnel-row header"><div>#</div><div>组件</div><div>曝光规模</div><div class="funnel-num">曝光 UV</div><div class="funnel-num">点击 UV</div><div class="funnel-ctr">CTR</div></div>`;
  const body=rows.map((r,i)=>{ const width=Math.max(2,(r.exposureUV||0)/maxExposure*100); return `<div class="funnel-row"><div class="funnel-index">${i+1}</div><div class="funnel-name">${esc(r.component)}</div><div class="funnel-track"><div class="funnel-fill" style="width:${width}%"></div><span>${fmtPct(r.ctr,2)}</span></div><div class="funnel-num">${fmtInt(r.exposureUV)}</div><div class="funnel-num">${fmtInt(r.clickUV)}</div><div class="funnel-ctr">${fmtPct(r.ctr,2)}</div></div>`; }).join('');
  el.innerHTML=header+body;
}
function renderQuickViews(){
  const pRows=filteredPage(), cRows=filteredComp();
  const pageRegions=pageAgg(pRows,['region']).filter(r=>r.ctr!=null);
  const compRows=compAgg(cRows,['component']).filter(r=>r.ctr!=null);
  $('quickBox').innerHTML = [
    quickCard('页面 CTR Top 5 Region', sorted(pageRegions,'ctr',-1).slice(0,5), 'region', 'ctr', v=>fmtPct(v,2)),
    quickCard('页面 CTR Bottom 5 Region', sorted(pageRegions,'ctr',1).slice(0,5), 'region', 'ctr', v=>fmtPct(v,2)),
    quickCard('组件 CTR Top 5', sorted(compRows,'ctr',-1).slice(0,5), 'component', 'ctr', v=>fmtPct(v,2))
  ].join('');
}
function quickCard(title, rows, nameKey, valueKey, fmt){ return `<div class="quick-card"><div class="quick-title">${title}</div><div class="quick-list">${rows.length?rows.map((r,i)=>`<div class="quick-row"><span class="quick-name" title="${esc(r[nameKey])}">${i+1}. ${esc(r[nameKey])}</span><span class="quick-val">${fmt(r[valueKey])}</span></div>`).join(''):'<div class="empty">无数据</div>'}</div></div>`; }
function renderDetails(){
  let rows, cols;
  if(state.tab==='page'){
    rows=sorted(pageAgg(filteredPage(),['region','locale']),'ctr',-1);
    cols=[['排名','rank'],['Region','region'],['Locale','locale'],['页面 CTR','ctr'],['页面 UV','pageUV'],['导流 UV','flowUV']];
  } else {
    rows=sorted(compAgg(filteredComp(),['region','locale','component']),'ctr',-1);
    cols=[['排名','rank'],['Region','region'],['Locale','locale'],['组件','component'],['组件 CTR','ctr'],['曝光 UV','exposureUV'],['点击 UV','clickUV']];
  }
  $('detailTable').innerHTML = rows.length ? `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${cols.map(c=>cell(c[1],r,i)).join('')}</tr>`).join('')}</tbody></table></div>` : '<div class="empty">当前筛选无数据</div>';
}
function cell(key,r,i){
  if(key==='rank') return `<td><span class="rank ${i<3?'top':''}">${i+1}</span></td>`;
  if(key==='ctr') return `<td class="num">${fmtPct(r.ctr,2)}</td>`;
  if(['pageUV','flowUV','exposureUV','clickUV'].includes(key)) return `<td class="num">${fmtInt(r[key])}</td>`;
  return `<td>${esc(r[key])}</td>`;
}
function renderAll(){ renderFilters(); renderKPIs(); renderQuickViews(); renderTrends(); renderComponentFunnel(); renderDetails(); }
function exportExcel(){
  const table = $('detailTable').querySelector('table');
  if(!table) return;
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body>${table.outerHTML}</body></html>`;
  const blob=new Blob(['\ufeff'+html],{type:'application/vnd.ms-excel;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='亲子频道CTR明细.xls'; a.click(); URL.revokeObjectURL(url);
}
document.addEventListener('DOMContentLoaded',()=>{
  fetch('./data.json?_='+Date.now()).then(r=>r.json()).then(d=>{
    DATA=d;
    dates=[...new Set(DATA.pageRows.map(r=>r.date))].sort();
    regions=[...new Set(DATA.pageRows.map(r=>r.region))].sort();
    locales=[...new Set(DATA.pageRows.map(r=>r.locale))].sort();
    state={tab:'page',dates:new Set(dates),regions:new Set(regions),locales:new Set(locales)};
  $('dateBadge').textContent = `数据日期范围：${dates[0]} ~ ${dates[dates.length-1]}`;
  $('regionBadge').textContent = `Region：${regions.length} 个`;
  renderAll();
  $('resetBtn').addEventListener('click',()=>{ state.dates=new Set(dates); state.regions=new Set(regions); state.locales=new Set(locales); renderAll(); });
  $('exportBtn').addEventListener('click',exportExcel);
  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{ document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); state.tab=btn.dataset.tab; renderDetails(); }));
  }).catch(e=>{ document.body.innerHTML='<p style="padding:40px;color:#b42318">数据加载失败：'+e.message+'</p>'; });
});
</script>
</body>
